<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMDb Review Sentiment Classifier</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    padding: 40px 20px;
  }
  .container { max-width: 640px; margin: 0 auto; }
  .header { margin-bottom: 28px; }
  .header h1 { font-size: 22px; margin: 0 0 6px; }
  .header p { color: #666; font-size: 13.5px; margin: 0; }

  .card {
    background: #fff;
    border: 1px solid #e2e4e8;
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #666;
    margin: 0 0 14px;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    border: 1px solid #d8dade;
    border-radius: 6px;
    padding: 12px;
    font-family: inherit;
    font-size: 14.5px;
    resize: vertical;
  }

  button {
    margin-top: 14px;
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 11px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  .result { display: none; margin-top: 20px; }
  .result.show { display: block; }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .badge.positive { background: #e6f4ea; color: #1e7e34; }
  .badge.negative { background: #fbe9e7; color: #c0392b; }

  .confidence-bar {
    margin-top: 12px;
    height: 8px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
  }
  .confidence-fill { height: 100%; width: 0%; transition: width 0.5s ease; }
  .confidence-fill.positive { background: #2e9e5b; }
  .confidence-fill.negative { background: #d9534f; }
  .confidence-text { font-size: 12.5px; color: #666; margin-top: 6px; }

  .metrics { display: flex; gap: 16px; flex-wrap: wrap; }
  .metric { flex: 1; min-width: 120px; }
  .metric .value { font-size: 22px; font-weight: 700; }
  .metric .label { font-size: 11.5px; color: #777; margin-top: 2px; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>IMDb Review Sentiment Classifier</h1>
    <p>NLP internship project &mdash; Nettech India</p>
  </div>

  <div class="card">
    <h2>Enter a movie review</h2>
    <textarea id="reviewInput" placeholder="Type or paste a movie review here..."></textarea>
    <br>
    <button id="predictBtn">Analyze Sentiment</button>

    <div class="result" id="result">
      <span class="badge" id="badge">Positive</span>
      <div class="confidence-bar">
        <div class="confidence-fill" id="confidenceFill"></div>
      </div>
      <div class="confidence-text" id="confidenceText"></div>
    </div>
  </div>

  <div class="card">
    <h2>Model performance</h2>
    <div class="metrics">
      <div class="metric"><div class="value">89.1%</div><div class="label">Accuracy</div></div>
      <div class="metric"><div class="value">0.89</div><div class="label">F1-score</div></div>
      <div class="metric"><div class="value">50,000</div><div class="label">Reviews trained on</div></div>
    </div>
  </div>

</div>

<script>
  const btn = document.getElementById('predictBtn');
  const input = document.getElementById('reviewInput');
  const result = document.getElementById('result');
  const badge = document.getElementById('badge');
  const fill = document.getElementById('confidenceFill');
  const text = document.getElementById('confidenceText');

  btn.addEventListener('click', async () => {
    const review = input.value.trim();
    if (!review) { input.focus(); return; }

    btn.disabled = true;
    btn.textContent = 'Analyzing...';

    try {
      const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ review })
      });
      const data = await res.json();

      const isPositive = data.sentiment === 'Positive';
      badge.textContent = data.sentiment;
      badge.className = 'badge ' + (isPositive ? 'positive' : 'negative');
      fill.className = 'confidence-fill ' + (isPositive ? 'positive' : 'negative');
      fill.style.width = data.confidence + '%';
      text.textContent = 'Model confidence: ' + data.confidence + '%';
      result.classList.add('show');
    } catch (err) {
      alert('Something went wrong. Make sure the Flask server is running.');
    }

    btn.disabled = false;
    btn.textContent = 'Analyze Sentiment';
  });
</script>
</body>
</html>
